[project]
name = "agent-bridge"
version = "0.1.0"
description = "Agent Bridge Phase-0 PoC: framework-agnostic Skills and MCP asset adapter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-ai>=2.0",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.6,<2",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
    "sse-starlette>=2.2",
    "anyio>=4.7",
    "structlog>=24.4",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: 需要真实乐享凭证与 RUN_LIVE=1 才执行的用例",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
